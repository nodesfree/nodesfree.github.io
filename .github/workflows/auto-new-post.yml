name: Auto Create Today Post

on:
  workflow_dispatch: # 允许在 GitHub 后台手动触发
  # schedule:
  #   - cron: '0 0 * * *' # 如果需要每天定时自动运行，可取消此行注释

jobs:
  create-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行脚本生成今日文章
        run: |
          python - << 'EOF'
          import os
          import glob
          import datetime
          import re

          posts_dir = "_posts"
          if not os.path.exists(posts_dir):
              print(f"Directory {posts_dir} not found.")
              exit(1)

          # 寻找 _posts 下所有的 md 或 markdown 文件
          files = glob.glob(os.path.join(posts_dir, "*.md")) + glob.glob(os.path.join(posts_dir, "*.markdown"))
          if not files:
              print("No posts found.")
              exit(0)

          # 按文件名降序排序，获取最新的文件
          files.sort(reverse=True)
          latest_file = files[0]
          print(f"Latest file found: {latest_file}")

          # 提取旧日期 (匹配文件名开头的 YYYY-MM-DD)
          basename = os.path.basename(latest_file)
          date_match = re.match(r'^(\d{4}-\d{2}-\d{2})', basename)
          if not date_match:
              print("Latest file name does not start with YYYY-MM-DD.")
              exit(1)
          old_date_str = date_match.group(1)

          # 获取当天的日期
          today_str = datetime.date.today().strftime('%Y-%m-%d')
          if old_date_str == today_str:
              print("The latest post is already dated today. Skipping creation.")
              exit(0)

          # 生成新文件名并构建路径
          new_basename = basename.replace(old_date_str, today_str, 1)
          new_file = os.path.join(posts_dir, new_basename)

          if os.path.exists(new_file):
              print(f"File {new_file} already exists.")
              exit(0)

          # 读取旧文件内容并全局替换日期
          with open(latest_file, 'r', encoding='utf-8') as f:
              content = f.read()

          new_content = content.replace(old_date_str, today_str)

          # 写入新文件
          with open(new_file, 'w', encoding='utf-8') as f:
              f.write(new_content)

          print(f"Successfully created new post: {new_file} with date {today_str}")
          EOF

      - name: 提交并推送修改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate post for today"
          branch: main
